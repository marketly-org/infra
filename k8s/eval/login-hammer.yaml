# Accelerated /auth/login load for the GitHub Actions (kind) eval.
#
# The stock traffic generator (scripts/02-start-traffic.sh) hits /auth/login
# ~2x/second, which would take many hours to grow user-api's token Map to
# the OOM threshold even with --max-old-space-size=128. This deployment
# raises login concurrency (~30-60 req/s) so the memory-leak incident fires
# inside the eval's soak window. It only adds load — the bug is unchanged.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: login-hammer
  namespace: marketly
  labels:
    app: login-hammer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: login-hammer
  template:
    metadata:
      labels:
        app: login-hammer
    spec:
      containers:
        - name: hammer
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              # Login requires a real user (bcrypt vs DB), so register the
              # load-test users once, then hammer /auth/login: every
              # successful login issues a NEW refresh token into the
              # unbounded Map — that is the leak.
              for i in $(seq 1 8); do
                wget -q -O /dev/null \
                  --post-data='{"email":"loadtest'"$i"'@example.com","password":"test-password","name":"Load Test '"$i"'"}' \
                  --header='Content-Type: application/json' \
                  http://user-api.marketly.svc.cluster.local:8080/auth/register || true
              done
              for i in $(seq 1 8); do
                (
                  while true; do
                    wget -q -O /dev/null \
                      --post-data='{"email":"loadtest'"$i"'@example.com","password":"test-password"}' \
                      --header='Content-Type: application/json' \
                      http://user-api.marketly.svc.cluster.local:8080/auth/login || true
                    sleep 0.3
                  done
                ) &
              done
              wait
          resources:
            requests:
              cpu: 50m
              memory: 16Mi
            limits:
              cpu: 300m
              memory: 64Mi
