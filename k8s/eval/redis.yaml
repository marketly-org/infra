# In-cluster Redis for the GitHub Actions (kind) eval.
# Replaces Azure Cache for Redis from the AKS path.
#
# Consumed by notification-worker (Celery broker) and analytics-worker
# (Sidekiq) via the `marketly-redis-credentials` secret (key: url), set to
# redis://:marketly-eval@redis.marketly.svc.cluster.local:6379/0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: marketly
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["--requirepass", "marketly-eval"]
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: marketly
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
