# Secret with Postgres + Redis connection strings for all services.
# The actual values are filled in by the deploy script from Terraform outputs.
---
apiVersion: v1
kind: Secret
metadata:
  name: marketly-db-credentials
  namespace: marketly
type: Opaque
stringData:
  checkout-url: "postgresql://marketly_admin:PLACEHOLDER@marketly-pg.postgres.database.azure.com:5432/checkout?sslmode=require"
  payments-url: "postgresql://marketly_admin:PLACEHOLDER@marketly-pg.postgres.database.azure.com:5432/payments?sslmode=require"
  inventory-url: "postgresql://marketly_admin:PLACEHOLDER@marketly-pg.postgres.database.azure.com:5432/inventory?sslmode=require"
  users-url: "postgresql://marketly_admin:PLACEHOLDER@marketly-pg.postgres.database.azure.com:5432/users?sslmode=require"
  shipping-url: "postgresql://marketly_admin:PLACEHOLDER@marketly-pg.postgres.database.azure.com:5432/shipping?sslmode=require"
  search-url: "postgresql://marketly_admin:PLACEHOLDER@marketly-pg.postgres.database.azure.com:5432/search?sslmode=require"
  recommendation-url: "postgresql://marketly_admin:PLACEHOLDER@marketly-pg.postgres.database.azure.com:5432/recommendation?sslmode=require"
  workers-url: "postgresql://marketly_admin:PLACEHOLDER@marketly-pg.postgres.database.azure.com:5432/workers?sslmode=require"
---
apiVersion: v1
kind: Secret
metadata:
  name: marketly-secrets
  namespace: marketly
type: Opaque
stringData:
  jwt-secret: "marketly-jwt-secret-change-in-prod"
  stripe-api-key: "PLACEHOLDER"
  redis-url: "PLACEHOLDER.redis.cache.windows.net:6380"
