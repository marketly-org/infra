# Argo CD Application definitions for all 9 Marketly services.
# Apply with: kubectl apply -f argocd-apps.yaml
#
# Each Application watches a repo's k8s/ directory and syncs it to the
# marketly namespace. When CI pushes a new image tag to k8s/deployment.yaml,
# Argo CD detects the drift and applies the new manifest.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: checkout-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/marketly-org/checkout-api
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: marketly
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
