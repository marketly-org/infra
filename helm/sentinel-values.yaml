# Sentinel Helm values for the Marketly test cluster.
#
# Secrets (LLM key, GitHub token, Stripe key) are pulled from Key Vault
# at deploy time by the deploy script and passed as --set overrides.

image:
  registry: "docker.io/karimzakzouk"
  repository: "sentinel"
  tag: "1.7.13"
  pullPolicy: Always

sentinel:
  # GitHub token — REQUIRED (passed via --set)
  githubToken: ""

  # Admin API bearer token
  apiToken: "marketly-sentinel-token"

  # GitHub repo allowlist — only these repos can be cloned
  allowedGithubRepos: "marketly-org/checkout-api,marketly-org/payments-api,marketly-org/inventory-api,marketly-org/user-api,marketly-org/search-api,marketly-org/shipping-api,marketly-org/analytics-worker,marketly-org/notification-worker,marketly-org/recommendation-engine"

  # LLM settings (keys passed via --set)
  llm:
    provider: "zai"
    apiKey: ""
    fastModel: "glm-4-flash"
    frontierModel: "glm-4.5"

  # Auto-merge: Sentinel's PRs are auto-merged if CI passes + confidence
  # clears the floor + sandbox verification depth >= L3 (v1.7.0 gate).
  #
  # minConfidence 0.50 (eval-calibrated): the fix-proposer's self-reported
  # confidence is hedged for free/mid-tier models and carries almost no
  # quality signal — run #21 proposed 3/3 ground-truth-matching fixes at
  # 0.61-0.68 (broken shipping-api fix was the HIGHEST at 0.68), and run
  # #24 self-reported 0.548 on a fix that passed the ENTIRE sandbox suite
  # (L1-L5 incl. reproducer) while 0.66 went to a fix the L3 oracle
  # rejected. 0.55 died by three thousandths of a point. 0.50 keeps a
  # garbage floor (~0.3-0.4 "I'm flailing" self-reports) without
  # pretending the number is calibrated. Quality control belongs to the
  # measured gates: sandbox L1-L5 + CI. Raise toward 0.85 only with
  # frontier-tier models, whose self-reports track reality.
  autoMerge:
    enabled: true
    namespaces: ["marketly"]
    minConfidence: 0.50
    requireCI: true
    ciTimeoutSec: 300
    maxPerHour: 5
    cooldownMin: 10
    minSandboxLevel: 3
    # v1.7.12 CI-failure feedback loop: red CI feeds the failing test
    # output back to the fix proposer, which pushes a corrected commit to
    # the same branch (CI re-runs). Run #26: shipping-api's fix stopped
    # the crash but broke the blank-zip contract test — the PR just sat
    # there until the harness closed it.
    ciRetries: 2

  # v1.7.12 post-deploy health check: after a merge, watch the deployed
  # pods (restarts / OOMKills / readiness) and auto-revert on regression.
  # Catches fixes that pass the no-traffic sandbox but fail under real
  # load (run #26 user-api: tokenStore leak OOM-looped the deployed pods
  # while the canary, idle, sailed through L1-L5).
  # regressionCooldown=false — one bad merge must not pause the OTHER
  # services' merges for the eval's whole window.
  postDeployCheck:
    enabled: true
    # 900s: user-api's leak-to-crash cycle is ~8.5min — the 420s window
    # missed the first crash of the merged (wrong) fix by 80 seconds in
    # run #27, so a hallucinated fix stayed merged.
    durationSec: 900
    regressionCooldown: false
    revertAutoMerge: true

  # v1.7.13 repo CI checks (pre-PR oracle): run the repo's own fmt + test
  # suite against the fix branch before opening the PR. New failures vs
  # the base branch block + feed the fix-proposer retry loop. This moves
  # CI's oracle before the PR — run #27's three GT-correct fixes all died
  # in CI on things the sandbox never checked.
  repoChecks:
    enabled: true
    required: true
    # Toolchain pods install deps before running tests (maven/rspec/jest);
    # 900s covers a cold maven run.
    timeoutSec: 900

  # L2 safe-actions (immediate remediation)
  safeActions:
    enabled: false  # disabled for testing

  # Fix verification — canary metrics after a fix deploys (v1.7.0+)
  fixVerify:
    enabled: true

# NOTE: the rbac block lives UNDER `sentinel:` — the chart reads
# sentinel.rbac.writeNamespaces (env SENTINEL_WRITE_NAMESPACES + per-namespace
# Role/RoleBinding creation) and sentinel.rbac.readSecrets (ClusterRole secret
# reads, needed by the sandbox to copy secrets). A top-level `rbac:` block is
# silently ignored by Helm — that exact mistake cost eval run #7 its only PR:
# the fix was generated in 9s and then discarded with
# "execution denied — namespace not in allowlist".
  rbac:
    writeNamespaces: ["marketly"]
    readSecrets: true  # sandbox copies prod secrets into the sandbox namespace

ingress:
  enabled: true
  className: "nginx"
  hosts:
    - host: sentinel.marketly.local
      paths:
        - path: /
          pathType: Prefix

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
