# Sentinel Helm values for the Marketly test cluster.
#
# Secrets (LLM key, GitHub token, Stripe key) are pulled from Key Vault
# at deploy time by the deploy script and passed as --set overrides.

image:
  registry: "docker.io/karimzakzouk"
  repository: "sentinel"
  tag: "1.7.9"
  pullPolicy: Always

sentinel:
  # GitHub token — REQUIRED (passed via --set)
  githubToken: ""

  # Admin API bearer token
  apiToken: "marketly-sentinel-token"

  # GitHub repo allowlist — only these repos can be cloned
  allowedGithubRepos: "marketly-org/checkout-api,marketly-org/payments-api,marketly-org/inventory-api,marketly-org/user-api,marketly-org/search-api,marketly-org/shipping-api,marketly-org/analytics-worker,marketly-org/notification-worker,marketly-org/recommendation-engine"

  # LLM settings (keys passed via --set)
  llm:
    provider: "zai"
    apiKey: ""
    fastModel: "glm-4-flash"
    frontierModel: "glm-4.5"

  # Auto-merge: Sentinel's PRs are auto-merged if CI passes + confidence
  # clears the floor + sandbox verification depth >= L3 (v1.7.0 gate).
  #
  # minConfidence 0.55 (eval-calibrated): the fix-proposer's self-reported
  # confidence is hedged for free/mid-tier models — run #21 proposed 3/3
  # ground-truth-matching fixes at 0.61-0.68, so the old 0.70 threshold
  # meant "never merge" while contributing no quality signal (the broken
  # shipping-api fix that run was the HIGHEST-confidence one at 0.68).
  # Quality control belongs to the measured gates: sandbox L1-L5 + CI.
  # 0.55 keeps a garbage floor (~0.3-0.4 "I'm flailing" self-reports)
  # without pretending the number is calibrated. Raise it back toward
  # 0.85 only with frontier-tier models, whose self-reports track reality.
  autoMerge:
    enabled: true
    namespaces: ["marketly"]
    minConfidence: 0.55
    requireCI: true
    ciTimeoutSec: 300
    maxPerHour: 5
    cooldownMin: 10
    minSandboxLevel: 3

  # L2 safe-actions (immediate remediation)
  safeActions:
    enabled: false  # disabled for testing

  # Fix verification — canary metrics after a fix deploys (v1.7.0+)
  fixVerify:
    enabled: true

# NOTE: the rbac block lives UNDER `sentinel:` — the chart reads
# sentinel.rbac.writeNamespaces (env SENTINEL_WRITE_NAMESPACES + per-namespace
# Role/RoleBinding creation) and sentinel.rbac.readSecrets (ClusterRole secret
# reads, needed by the sandbox to copy secrets). A top-level `rbac:` block is
# silently ignored by Helm — that exact mistake cost eval run #7 its only PR:
# the fix was generated in 9s and then discarded with
# "execution denied — namespace not in allowlist".
  rbac:
    writeNamespaces: ["marketly"]
    readSecrets: true  # sandbox copies prod secrets into the sandbox namespace

ingress:
  enabled: true
  className: "nginx"
  hosts:
    - host: sentinel.marketly.local
      paths:
        - path: /
          pathType: Prefix

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
